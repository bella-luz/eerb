<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1929;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="humanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aa8a2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14c8c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0fa9a9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="energyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#bgGradient)"/>

  <!-- Energy Lines/Network -->
  <circle cx="150" cy="100" r="2" fill="#14c8c8" opacity="0.6"/>
  <circle cx="450" cy="150" r="2" fill="#14c8c8" opacity="0.6"/>
  <circle cx="300" cy="380" r="2" fill="#14c8c8" opacity="0.6"/>

  <path d="M 150 100 L 300 250" stroke="#14c8c8" stroke-width="1" opacity="0.4"/>
  <path d="M 450 150 L 300 250" stroke="#14c8c8" stroke-width="1" opacity="0.4"/>
  <path d="M 300 250 L 300 380" stroke="#14c8c8" stroke-width="1" opacity="0.4"/>

  <!-- Central Connection Point (Glow) -->
  <circle cx="300" cy="250" r="15" fill="#14c8c8" opacity="0.2" filter="url(#glow)"/>
  <circle cx="300" cy="250" r="8" fill="#14c8c8" opacity="0.4"/>

  <!-- HUMAN - Left side -->
  <g>
    <!-- Head -->
    <circle cx="120" cy="100" r="30" fill="url(#humanGradient)"/>
    <!-- Hair -->
    <path d="M 90 90 Q 90 70 120 70 Q 150 70 150 90" fill="#8B7500"/>
    <!-- Face details -->
    <circle cx="110" cy="95" r="3" fill="#000"/>
    <circle cx="130" cy="95" r="3" fill="#000"/>
    <path d="M 115 110 Q 120 115 125 110" stroke="#000" stroke-width="1.5" fill="none"/>

    <!-- Body -->
    <rect x="95" y="135" width="50" height="60" rx="5" fill="url(#humanGradient)"/>
    <!-- Arms -->
    <rect x="60" y="145" width="35" height="15" rx="7" fill="url(#humanGradient)"/>
    <rect x="145" y="145" width="35" height="15" rx="7" fill="url(#humanGradient)"/>
    <!-- Hand reaching out (toward connection) -->
    <circle cx="205" cy="150" r="8" fill="url(#humanGradient)"/>
    <!-- Legs -->
    <rect x="100" y="200" width="12" height="40" rx="6" fill="#333"/>
    <rect x="118" y="200" width="12" height="40" rx="6" fill="#333"/>

    <!-- Hand glow pointing to center -->
    <circle cx="205" cy="150" r="12" fill="#d4af37" opacity="0.2" filter="url(#glow)"/>

    <!-- Energy flowing from human -->
    <path d="M 205 150 L 280 200" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- AI AGENT 1 - Top Right (Larger, Main) -->
  <g>
    <!-- Head/Core -->
    <circle cx="420" cy="100" r="28" fill="url(#robotGradient)"/>
    <!-- Brain/Processor ring -->
    <circle cx="420" cy="100" r="20" fill="none" stroke="#14c8c8" stroke-width="2" opacity="0.6"/>
    <!-- Eyes -->
    <circle cx="410" cy="95" r="4" fill="#0a0e1a"/>
    <circle cx="430" cy="95" r="4" fill="#0a0e1a"/>
    <circle cx="410" cy="95" r="2" fill="#14c8c8"/>
    <circle cx="430" cy="95" r="2" fill="#14c8c8"/>

    <!-- Body -->
    <rect x="395" y="135" width="50" height="65" rx="5" fill="url(#robotGradient)"/>
    <!-- Panels on chest -->
    <rect x="400" y="145" width="8" height="15" fill="#0a0e1a" opacity="0.5"/>
    <rect x="412" y="145" width="8" height="15" fill="#14c8c8" opacity="0.8"/>
    <rect x="424" y="145" width="8" height="15" fill="#0a0e1a" opacity="0.5"/>
    <rect x="400" y="165" width="8" height="15" fill="#0a0e1a" opacity="0.5"/>
    <rect x="412" y="165" width="8" height="15" fill="#9333ea" opacity="0.8"/>
    <rect x="424" y="165" width="8" height="15" fill="#0a0e1a" opacity="0.5"/>

    <!-- Arms extended -->
    <rect x="360" y="150" width="35" height="14" rx="7" fill="url(#robotGradient)"/>
    <rect x="445" y="150" width="35" height="14" rx="7" fill="url(#robotGradient)"/>
    <!-- Hand reaching back (toward connection) -->
    <circle cx="355" cy="157" r="7" fill="url(#robotGradient)"/>
    <!-- Legs -->
    <rect x="402" y="205" width="11" height="45" rx="5.5" fill="#14c8c8"/>
    <rect x="420" y="205" width="11" height="45" rx="5.5" fill="#14c8c8"/>

    <!-- Hand glow -->
    <circle cx="355" cy="157" r="11" fill="#14c8c8" opacity="0.2" filter="url(#glow)"/>

    <!-- Energy from agent -->
    <path d="M 355 157 L 290 220" stroke="#14c8c8" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- AI AGENT 2 - Bottom Left -->
  <g>
    <!-- Head -->
    <circle cx="180" cy="380" r="22" fill="url(#robotGradient)"/>
    <!-- Brain -->
    <circle cx="180" cy="380" r="16" fill="none" stroke="#14c8c8" stroke-width="1.5" opacity="0.5"/>
    <!-- Eyes -->
    <circle cx="172" cy="377" r="2" fill="#14c8c8"/>
    <circle cx="188" cy="377" r="2" fill="#14c8c8"/>

    <!-- Body -->
    <rect x="160" y="405" width="40" height="50" rx="4" fill="url(#robotGradient)"/>
    <!-- Panels -->
    <rect x="165" y="412" width="6" height="10" fill="#9333ea" opacity="0.8"/>
    <rect x="176" y="412" width="6" height="10" fill="#0a0e1a" opacity="0.5"/>
    <rect x="187" y="412" width="6" height="10" fill="#14c8c8" opacity="0.8"/>

    <!-- Arms -->
    <rect x="130" y="415" width="30" height="11" rx="5.5" fill="url(#robotGradient)"/>
    <rect x="200" y="415" width="30" height="11" rx="5.5" fill="url(#robotGradient)"/>
    <!-- Legs -->
    <rect x="168" y="460" width="8" height="30" rx="4" fill="#14c8c8"/>
    <rect x="184" y="460" width="8" height="30" rx="4" fill="#14c8c8"/>

    <!-- Energy -->
    <path d="M 180 405 L 280 310" stroke="#14c8c8" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- AI AGENT 3 - Bottom Right -->
  <g>
    <!-- Head -->
    <circle cx="420" cy="380" r="22" fill="url(#robotGradient)"/>
    <!-- Brain -->
    <circle cx="420" cy="380" r="16" fill="none" stroke="#14c8c8" stroke-width="1.5" opacity="0.5"/>
    <!-- Eyes -->
    <circle cx="412" cy="377" r="2" fill="#14c8c8"/>
    <circle cx="428" cy="377" r="2" fill="#14c8c8"/>

    <!-- Body -->
    <rect x="400" y="405" width="40" height="50" rx="4" fill="url(#robotGradient)"/>
    <!-- Panels -->
    <rect x="405" y="412" width="6" height="10" fill="#0a0e1a" opacity="0.5"/>
    <rect x="416" y="412" width="6" height="10" fill="#14c8c8" opacity="0.8"/>
    <rect x="427" y="412" width="6" height="10" fill="#9333ea" opacity="0.8"/>

    <!-- Arms -->
    <rect x="370" y="415" width="30" height="11" rx="5.5" fill="url(#robotGradient)"/>
    <rect x="440" y="415" width="30" height="11" rx="5.5" fill="url(#robotGradient)"/>
    <!-- Legs -->
    <rect x="408" y="460" width="8" height="30" rx="4" fill="#14c8c8"/>
    <rect x="424" y="460" width="8" height="30" rx="4" fill="#14c8c8"/>

    <!-- Energy -->
    <path d="M 420 405 L 320 310" stroke="#14c8c8" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Central Energy Burst -->
  <circle cx="300" cy="250" r="20" fill="none" stroke="#9333ea" stroke-width="2" opacity="0.4"/>
  <circle cx="300" cy="250" r="25" fill="none" stroke="#14c8c8" stroke-width="1" opacity="0.2"/>

  <!-- Data flowing upward -->
  <g opacity="0.4">
    <rect x="295" y="260" width="10" height="8" fill="#14c8c8" rx="2"/>
    <rect x="295" y="275" width="10" height="8" fill="#9333ea" rx="2"/>
    <rect x="295" y="290" width="10" height="8" fill="#14c8c8" rx="2"/>
  </g>

  <!-- Analysis indicators -->
  <g opacity="0.5" font-family="Arial, sans-serif" font-size="10" fill="#14c8c8">
    <text x="40" y="40" font-weight="bold">AGENTS</text>
    <text x="490" y="40" font-weight="bold">SYNERGY</text>
  </g>
</svg>