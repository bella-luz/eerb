<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 28px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-size: 14px; fill: #666666; }
      .layer-label { font-size: 14px; font-weight: bold; fill: #ffffff; letter-spacing: 1px; }
      .component-title { font-size: 13px; font-weight: bold; fill: #1a1a1a; }
      .component-text { font-size: 11px; fill: #444444; }
      .arrow { stroke: #0066cc; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .layer-ui { fill: #e3f2fd; }
      .layer-app { fill: #fff8e1; }
      .layer-agent { fill: #f3e5f5; }
      .layer-tool { fill: #e8f5e9; }
      .layer-data { fill: #fce4ec; }
      .component-box { stroke: #333333; stroke-width: 2; rx: 8; fill: #ffffff; }
      .layer-line { stroke: #999999; stroke-width: 1.5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#f9f9f9"/>

  <!-- Title Section -->
  <text x="700" y="35" text-anchor="middle" class="title">EERB System Architecture</text>
  <text x="700" y="55" text-anchor="middle" class="subtitle">Energy Engineering Review Board - Multi-Agent AI Platform</text>

  <!-- LAYER 1: USER INTERFACE -->
  <rect x="40" y="70" width="1320" height="130" class="layer-ui" rx="10" stroke="#90caf9" stroke-width="2"/>
  <text x="60" y="95" class="layer-label" fill="#01579b">LAYER 1: USER INTERFACE (Streamlit)</text>

  <rect x="70" y="110" width="290" height="80" class="component-box"/>
  <text x="215" y="130" text-anchor="middle" class="component-title">Home Page</text>
  <text x="215" y="150" text-anchor="middle" class="component-text">Problem Overview</text>
  <text x="215" y="165" text-anchor="middle" class="component-text">Instructions &amp; Info</text>

  <rect x="400" y="110" width="290" height="80" class="component-box"/>
  <text x="545" y="130" text-anchor="middle" class="component-title">Demo Project</text>
  <text x="545" y="150" text-anchor="middle" class="component-text">500kW PV + 1MWh BESS</text>
  <text x="545" y="165" text-anchor="middle" class="component-text">Pre-loaded Test Case</text>

  <rect x="730" y="110" width="290" height="80" class="component-box"/>
  <text x="875" y="130" text-anchor="middle" class="component-title">Upload Project</text>
  <text x="875" y="150" text-anchor="middle" class="component-text">CSV + Specifications</text>
  <text x="875" y="165" text-anchor="middle" class="component-text">Custom Analysis</text>

  <rect x="1060" y="110" width="290" height="80" class="component-box"/>
  <text x="1205" y="130" text-anchor="middle" class="component-title">Results Dashboard</text>
  <text x="1205" y="150" text-anchor="middle" class="component-text">Charts, Findings, Report</text>
  <text x="1205" y="165" text-anchor="middle" class="component-text">Download &amp; Export</text>

  <!-- Arrow -->
  <path d="M 700 200 L 700 240" class="arrow"/>

  <!-- LAYER 2: APPLICATION -->
  <rect x="40" y="240" width="1320" height="110" class="layer-app" rx="10" stroke="#ffe082" stroke-width="2"/>
  <text x="60" y="265" class="layer-label" fill="#e65100">LAYER 2: ORCHESTRATION &amp; COORDINATION</text>

  <rect x="250" y="275" width="900" height="60" class="component-box"/>
  <text x="700" y="297" text-anchor="middle" class="component-title">Agent Orchestrator</text>
  <text x="700" y="318" text-anchor="middle" class="component-text">Manages 6-agent workflow | Detects conflicts | Synthesizes findings | Produces final conclusions</text>

  <!-- Arrow -->
  <path d="M 700 335 L 700 375" class="arrow"/>

  <!-- LAYER 3: AI AGENTS -->
  <rect x="40" y="375" width="1320" height="180" class="layer-agent" rx="10" stroke="#ce93d8" stroke-width="2"/>
  <text x="60" y="400" class="layer-label" fill="#4a148c">LAYER 3: AI AGENT LAYER (6 Specialized Agents)</text>

  <!-- Agent Row 1 -->
  <rect x="70" y="420" width="180" height="115" class="component-box"/>
  <text x="160" y="442" text-anchor="middle" class="component-title">Lead Engineer</text>
  <text x="160" y="460" text-anchor="middle" class="component-text">Orchestrator</text>
  <text x="160" y="475" text-anchor="middle" class="component-text">Planner</text>
  <text x="160" y="490" text-anchor="middle" class="component-text">Synthesizer</text>
  <text x="160" y="525" text-anchor="middle" class="component-text" style="font-style: italic;">Coordinates all</text>

  <rect x="290" y="420" width="180" height="115" class="component-box"/>
  <text x="380" y="442" text-anchor="middle" class="component-title">Load Analyst</text>
  <text x="380" y="460" text-anchor="middle" class="component-text">Peak demand</text>
  <text x="380" y="475" text-anchor="middle" class="component-text">Duration</text>
  <text x="380" y="490" text-anchor="middle" class="component-text">Profile analysis</text>
  <text x="380" y="525" text-anchor="middle" class="component-text" style="font-style: italic;">Load metrics</text>

  <rect x="510" y="420" width="180" height="115" class="component-box"/>
  <text x="600" y="442" text-anchor="middle" class="component-title">PV Engineer</text>
  <text x="600" y="460" text-anchor="middle" class="component-text">Capacity</text>
  <text x="600" y="475" text-anchor="middle" class="component-text">Generation</text>
  <text x="600" y="490" text-anchor="middle" class="component-text">Coverage ratio</text>
  <text x="600" y="525" text-anchor="middle" class="component-text" style="font-style: italic;">PV adequacy</text>

  <rect x="730" y="420" width="180" height="115" class="component-box"/>
  <text x="820" y="442" text-anchor="middle" class="component-title">BESS Engineer</text>
  <text x="820" y="460" text-anchor="middle" class="component-text">Duration</text>
  <text x="820" y="475" text-anchor="middle" class="component-text">Peak-shaving</text>
  <text x="820" y="490" text-anchor="middle" class="component-text">Efficiency</text>
  <text x="820" y="525" text-anchor="middle" class="component-text" style="font-style: italic;">Battery check</text>

  <rect x="950" y="420" width="180" height="115" class="component-box"/>
  <text x="1040" y="442" text-anchor="middle" class="component-title">Spec Engineer</text>
  <text x="1040" y="460" text-anchor="middle" class="component-text">Document</text>
  <text x="1040" y="475" text-anchor="middle" class="component-text">Review (RAG)</text>
  <text x="1040" y="490" text-anchor="middle" class="component-text">Extraction</text>
  <text x="1040" y="525" text-anchor="middle" class="component-text" style="font-style: italic;">Specs validation</text>

  <rect x="1170" y="420" width="180" height="115" class="component-box"/>
  <text x="1260" y="442" text-anchor="middle" class="component-title">Independent Critic</text>
  <text x="1260" y="460" text-anchor="middle" class="component-text">Challenges findings</text>
  <text x="1260" y="475" text-anchor="middle" class="component-text">Finds conflicts</text>
  <text x="1260" y="490" text-anchor="middle" class="component-text">Gaps check</text>
  <text x="1260" y="525" text-anchor="middle" class="component-text" style="font-style: italic;">QA &amp; conflicts</text>

  <!-- Arrow -->
  <path d="M 700 555 L 700 595" class="arrow"/>

  <!-- LAYER 4: TOOLS & CALCULATIONS -->
  <rect x="40" y="595" width="1320" height="160" class="layer-tool" rx="10" stroke="#81c784" stroke-width="2"/>
  <text x="60" y="620" class="layer-label" fill="#1b5e20">LAYER 4: DETERMINISTIC CALCULATION ENGINE (Python, No LLM)</text>

  <rect x="100" y="645" width="250" height="100" class="component-box"/>
  <text x="225" y="668" text-anchor="middle" class="component-title">Load Calculations</text>
  <text x="225" y="688" text-anchor="middle" class="component-text">Peak demand, Average</text>
  <text x="225" y="703" text-anchor="middle" class="component-text">Daily energy, Duration</text>
  <text x="225" y="718" text-anchor="middle" class="component-text">Load characteristics</text>

  <rect x="400" y="645" width="250" height="100" class="component-box"/>
  <text x="525" y="668" text-anchor="middle" class="component-title">PV Calculations</text>
  <text x="525" y="688" text-anchor="middle" class="component-text">Capacity ratios</text>
  <text x="525" y="703" text-anchor="middle" class="component-text">Generation estimate</text>
  <text x="525" y="718" text-anchor="middle" class="component-text">Coverage analysis</text>

  <rect x="700" y="645" width="250" height="100" class="component-box"/>
  <text x="825" y="668" text-anchor="middle" class="component-title">Battery Simulation</text>
  <text x="825" y="688" text-anchor="middle" class="component-text">SOC simulation</text>
  <text x="825" y="703" text-anchor="middle" class="component-text">Duration = Energy/Power</text>
  <text x="825" y="718" text-anchor="middle" class="component-text">Peak reduction calc</text>

  <rect x="1000" y="645" width="250" height="100" class="component-box"/>
  <text x="1125" y="668" text-anchor="middle" class="component-title">RAG &amp; PDF Processing</text>
  <text x="1125" y="688" text-anchor="middle" class="component-text">PDF text extraction</text>
  <text x="1125" y="703" text-anchor="middle" class="component-text">Keyword-based search</text>
  <text x="1125" y="718" text-anchor="middle" class="component-text">Specification matching</text>

  <!-- Arrow -->
  <path d="M 700 765 L 700 805" class="arrow"/>

  <!-- LAYER 5: DATA -->
  <rect x="40" y="805" width="1320" height="150" class="layer-data" rx="10" stroke="#f06292" stroke-width="2"/>
  <text x="60" y="830" class="layer-label" fill="#880e4f">LAYER 5: DATA SOURCES &amp; EXTERNAL SERVICES</text>

  <rect x="100" y="855" width="280" height="80" class="component-box"/>
  <text x="240" y="877" text-anchor="middle" class="component-title">Demo Data (CSV)</text>
  <text x="240" y="897" text-anchor="middle" class="component-text">demo_load.csv</text>
  <text x="240" y="912" text-anchor="middle" class="component-text">demo_pv.csv</text>
  <text x="240" y="927" text-anchor="middle" class="component-text">(48-hour samples)</text>

  <rect x="430" y="855" width="280" height="80" class="component-box"/>
  <text x="570" y="877" text-anchor="middle" class="component-title">User Uploads</text>
  <text x="570" y="897" text-anchor="middle" class="component-text">Load profile (CSV)</text>
  <text x="570" y="912" text-anchor="middle" class="component-text">Spec sheets (PDF)</text>
  <text x="570" y="927" text-anchor="middle" class="component-text">Project metadata</text>

  <rect x="760" y="855" width="280" height="80" class="component-box"/>
  <text x="900" y="877" text-anchor="middle" class="component-title">Configuration</text>
  <text x="900" y="897" text-anchor="middle" class="component-text">Environment vars</text>
  <text x="900" y="912" text-anchor="middle" class="component-text">API credentials</text>
  <text x="900" y="927" text-anchor="middle" class="component-text">Streamlit secrets</text>

  <rect x="1090" y="855" width="280" height="80" class="component-box"/>
  <text x="1230" y="877" text-anchor="middle" class="component-title">LLM Provider</text>
  <text x="1230" y="897" text-anchor="middle" class="component-text">OpenAI API</text>
  <text x="1230" y="912" text-anchor="middle" class="component-text">GPT-3.5-turbo</text>
  <text x="1230" y="927" text-anchor="middle" class="component-text">For agent reasoning</text>

  <!-- Return Arrow -->
  <path d="M 650 935 L 650 965 L 700 965 L 700 975" class="arrow" stroke-dasharray="5,5"/>
  <text x="600" y="950" class="component-text" style="font-style: italic;">Results back to Dashboard</text>

</svg>